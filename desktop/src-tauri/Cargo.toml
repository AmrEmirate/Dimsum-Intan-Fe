[package]
name = "dimsum-intan-desktop"
version = "1.0.0"
description = "Aplikasi Desktop Dimsum Intan POS"
authors = ["Dimsum Intan"]
edition = "2021"

[lib]
name = "dimsum_intan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
